# LOCAL EDITOR WORKSPACE ONLY. Never use this file for remote DEV or production.
# Keep source editing separate from the immutable remote Compose deployments.
services:
  getnewsapi-local:
    build:
      context: ..
      dockerfile: Dockerfile
    working_dir: /workspaces/api-test/GetNewsAPI
    volumes:
      - ..:/workspaces/api-test:cached
    # Editor workspace only: does not start the API, a scheduler, or any database.
    command: ["sleep", "infinity"]
    healthcheck:
      disable: true
 
