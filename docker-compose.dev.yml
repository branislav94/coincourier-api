services:
  getnewsapi:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dev-getnewsapi

    env_file:
      - .env

    environment:
      APP_ENV: development
      PYTHONUNBUFFERED: "1"
      TZ: Europe/Belgrade

    ports:
      - "5001:5000"

    volumes:
      - ./GetNewsAPI:/app

    restart: unless-stopped

    command: python app.py

    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
    name: dokploy-network